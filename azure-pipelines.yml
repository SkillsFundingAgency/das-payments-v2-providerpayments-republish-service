trigger:
  batch: true
  branches:
    include:
      - "main"

variables:
- name: BuildPlatform
  value : 'x64'
- name: BuildConfiguration
  value: 'release'
resources:
  repositories:
    - repository: das-payments-v2-providerpayments-republish-service
      fetchDepth: 0
      type: github
      name: SkillsFundingAgency/das-payments-v2-providerpayments-republish-service
      endpoint: SkillsFundingAgency

stages:
- stage: Build_Unit_Tests
  displayName: 'Build and Unit Tests'
  jobs:
  - template: pipeline-templates/job/code-build.yml
  - template: pipeline-templates/job/unittests.yml

- stage: Deploy_DST
  displayName: 'Deploy to DST'
  variables:
  - name: tagEnvironment
    value: Dev/Test
  - group: DCOL-DST - Environment Key Vault Secrets
  - group: DCOL-DST - ProviderPaymentsRepublishService
  

  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      pool: DCT
      environmentName: DST
      azureSubscription: DCT-VSO
      appName: DCOL-DST-ProviderPaymentsRepublishService

- stage: Deploy_DAS
  dependsOn: Deploy_DST
  displayName: Deploy to DAS
  variables:
  - name: tagEnvironment
    value: Dev/Test
  - group: DCOL-DAS - Environment Key Vault Secrets
  - group: DCOL-DAS - ProviderPaymentsRepublishService
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      pool: DCT
      environmentName: DAS
      azureSubscription: DCT-VSO
      appName: DCOL-DAS-ProviderPaymentsRepublishService


